kind = "web"
previewPath = "/"
title = "Девять фундаментальных уроков жизни"
version = "1.0.0"
id = "artifacts/nine-lessons"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24643

[services.development]
run = "pnpm --filter @workspace/nine-lessons run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nine-lessons", "run", "build" ]
publicDir = "artifacts/nine-lessons/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24643"
BASE_PATH = "/"
