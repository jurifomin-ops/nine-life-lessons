name: Публикация на GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Сборка сайта
    runs-on: ubuntu-latest
    steps:
      - name: Получить код репозитория
        uses: actions/checkout@v4

      - name: Установить Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Установить pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Получить путь к кешу pnpm
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Кешировать зависимости pnpm
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Установить зависимости
        run: pnpm install --frozen-lockfile

      - name: Собрать сайт
        run: pnpm --filter @workspace/nine-lessons run build:github

      - name: Настроить GitHub Pages
        uses: actions/configure-pages@v5

      - name: Загрузить артефакт сборки
        uses: actions/upload-pages-artifact@v3
        with:
          path: artifacts/nine-lessons/dist/github

  deploy:
    name: Публикация на GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Опубликовать на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
